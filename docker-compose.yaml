# Default topology (config/ci). `docker compose up --build` builds the image
# locally, starts the topology and runs a one-shot load generator.
#
#   docker compose up --build                 # baseline (no policy)
#   MODE=masa docker compose up --build       # Masa composed policy
#
# Other topologies: docker compose -f deploy/<name>/docker-compose.yaml up --build
# (generated by scripts/gen-all.sh from config/<name>/topology.json).
include:
  - deploy/ci/docker-compose.yaml
