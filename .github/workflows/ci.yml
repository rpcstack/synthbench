name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: ./scripts/check.sh
      - run: ./scripts/test.sh

  compose-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, masa]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Dependencies are a separate cargo-chef layer (see Dockerfile); persist it
      # in the Actions cache so only this repository's crates compile when warm.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODE=${{ matrix.mode }}
          tags: rpcstack-synthbench:${{ matrix.mode }}
          load: true
          cache-from: type=gha,scope=synthbench-${{ matrix.mode }}
          cache-to: type=gha,scope=synthbench-${{ matrix.mode }},mode=max
      - run: scripts/smoke-compose.sh ${{ matrix.mode }}
        env:
          SKIP_BUILD: "1"

  k8s-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, masa]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: scripts/kind-up.sh
      # Same Dockerfile, build args and cache scope as compose-smoke.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODE=${{ matrix.mode }}
          tags: localhost:5001/rpcstack-synthbench:${{ matrix.mode }}
          load: true
          cache-from: type=gha,scope=synthbench-${{ matrix.mode }}
          cache-to: type=gha,scope=synthbench-${{ matrix.mode }},mode=max
      - run: docker push localhost:5001/rpcstack-synthbench:${{ matrix.mode }}
      - run: scripts/smoke-k8s.sh ${{ matrix.mode }}
        env:
          SKIP_BUILD: "1"
      - if: always()
        run: scripts/kind-down.sh
